<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nevergrad favicon</title>
  <desc id="desc">A dark school crest with a locked classroom mark, a cherry blossom accent, and the thirteenth cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070d"/>
      <stop offset="0.56" stop-color="#1b1221"/>
      <stop offset="1" stop-color="#332033"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2f6"/>
      <stop offset="0.54" stop-color="#ffbfd0"/>
      <stop offset="1" stop-color="#c55b77"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2331"/>
      <stop offset="1" stop-color="#110d17"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="0.42" stop-color="#ffb7c5"/>
      <stop offset="1" stop-color="#ed6f92"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="pinkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <path d="M72 168H440M72 256H440M72 344H440M168 72V440M256 72V440M344 72V440"
        stroke="#ffffff" stroke-width="4" opacity="0.055"/>
  <circle cx="392" cy="118" r="92" fill="#ffb7c5" opacity="0.09"/>

  <g filter="url(#softShadow)">
    <path d="M256 54L390 104V258C390 358 332 421 256 452C180 421 122 358 122 258V104Z"
          fill="#15101b" stroke="url(#crest)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M159 129H353V341C353 356 341 368 326 368H186C171 368 159 356 159 341Z"
          fill="url(#door)" stroke="#ffe2ea" stroke-width="10" stroke-linejoin="round"/>
    <path d="M181 151H331V199H181ZM181 222H331V270H181Z"
          fill="#ffd5df" opacity="0.18"/>
    <path d="M206 342V169H239L300 278V169H335V342H302L241 233V342Z"
          fill="#fff4f7"/>
    <path d="M354 170C372 190 383 218 383 251"
          fill="none" stroke="#ff6f9d" stroke-width="10" stroke-linecap="round" opacity="0.74"/>
    <path d="M372 178L348 177L358 199Z" fill="#ff6f9d" opacity="0.9"/>
  </g>

  <g filter="url(#pinkGlow)">
    <path d="M99 337C126 326 151 343 151 343C151 343 139 370 112 381C89 390 70 375 70 375C70 375 76 346 99 337Z"
          fill="url(#petal)" transform="rotate(-18 111 356)"/>
    <path d="M407 354C425 337 454 344 454 344C454 344 457 374 439 391C423 406 397 398 397 398C397 398 391 370 407 354Z"
          fill="url(#petal)" opacity="0.82" transform="rotate(24 426 371)"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="256" y="426" font-size="54" fill="#ffb7c5" opacity="0.94">13</text>
  </g>
</svg>
