<body>
    <!-- ===== Title Screen ===== -->
    <div id="title-screen" class="screen active">
        <a href="https://archerlab.dev" target="_blank" rel="noopener noreferrer" class="archerlab-link" aria-label="ArcherLab 홈" title="ArcherLab">ArcherLab</a>
        <select class="lang-switcher" aria-label="Language" onchange="if(this.value)location.href=this.value">
            <option value="/">한국어</option>
            <option value="/en/">English</option>
            <option value="/ja/">日本語</option>
            <option value="/es/">Español</option>
            <option value="/fr/">Français</option>
            <option value="/de/">Deutsch</option>
            <option value="/pt/">Português (Brasil)</option>
        </select>
        <script>
            (function(){
                var s=document.querySelector('.lang-switcher');
                if(!s)return;
                var p=location.pathname,c='/';
                ['/en/','/ja/','/es/','/fr/','/de/','/pt/'].forEach(function(x){if(p.indexOf(x)===0)c=x;});
                for(var i=0;i<s.options.length;i++)if(s.options[i].value===c){s.selectedIndex=i;break;}
            })();
        </script>
        <div class="title-bg-layer"></div>
        <div class="title-bg-vignette"></div>
        <div class="cherry-blossoms" id="cherry-blossoms"></div>
        <!-- SCENARIO.md 5454: 타이틀 배경(벚꽃) + 캐릭터 3 스프라이트 레이어. NG+ 시 세아만 시선 변경.
             src는 app.js가 런타임에 파일 존재 확인 후 주입 (미생성 에셋 에러 방지) -->
        <div id="title-stage" class="title-stage" aria-hidden="true">
            <img id="title-stage-bg" class="title-stage-bg" alt="" data-src="assets/images/background/cherry_blossom.png" onerror="this.style.display='none'">
            <img id="title-char-sea" class="title-char title-char-left" alt="" data-default="assets/images/characters/sea_normal.webp" data-ngp="assets/images/characters/sea_stare.webp" data-src="assets/images/characters/sea_normal.webp" onerror="this.style.display='none'">
            <img id="title-char-eunsu" class="title-char title-char-center" alt="" data-src="assets/images/characters/eunsu_normal.webp" onerror="this.style.display='none'">
            <img id="title-char-riin" class="title-char title-char-right" alt="" data-src="assets/images/characters/riin_smile.webp" onerror="this.style.display='none'">
        </div>
        <div class="title-content">
            <h1 class="title-text">졸업하지 못한 교실</h1>
            <div class="title-divider"></div>
            <p class="title-subtitle">5일의 기록</p>
        </div>
        <div class="title-menu">
            <button id="btn-new-game" class="menu-btn">새 게임</button>
            <button id="btn-continue" class="menu-btn" disabled>이어하기</button>
            <button id="btn-gallery" class="menu-btn">갤러리</button>
        </div>
        <div class="title-footer">
            <span class="title-copyright">NEVERGRAD</span>
        </div>
    </div>

    <!-- ===== Gallery Screen ===== -->
    <div id="gallery-screen" class="screen hidden">

            <div id="gallery-grid"></div>
            <div class="gallery-footer">
                <button id="gallery-back" class="menu-btn">돌아가기</button>

        </div>

    <!-- ===== Name Input Screen ===== -->
    <div id="name-screen" class="screen">

            <p class="name-prompt">당신의 이름은?</p>
            <input type="text" id="player-name-input" maxlength="8" placeholder="이름을 입력하세요">
            <button id="btn-start" class="menu-btn">시작</button>
        </div>
    </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="screen">
        <!-- Background Layer -->
        <div id="bg-layer" class="bg-layer"></div>
        <div id="bg-overlay" class="bg-overlay"></div>
        <div id="media-overlay" class="scene-media-layer hidden" aria-hidden="true"></div>

        <!-- Character Layer -->
        <div id="char-layer" class="char-layer">
            <img id="char-left" class="character-sprite pos-left" src="" alt="">
            <img id="char-center" class="character-sprite pos-center" src="" alt="">
            <img id="char-right" class="character-sprite pos-right" src="" alt="">
        </div>

        <!-- Glitch Overlay (thriller) -->
        <div id="glitch-overlay" class="glitch-overlay hidden"></div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-box">
            <div id="speaker-name" class="speaker-name"></div>
            <div id="dialogue-text" class="dialogue-text"></div>
            <div id="click-indicator" class="click-indicator">▼</div>
        </div>

        <!-- Choice Panel -->
        <div id="choice-panel" class="choice-panel hidden"></div>

        <!-- HUD -->
        <div id="hud" class="hud">
            <div id="day-display" class="day-display">1일차 - 아침</div>
            <div id="stat-display" class="stat-display hidden"></div>
        </div>

        <!-- Quick Menu — MENU 하나만. 저장/불러오기는 MENU → pause-menu 안에서 접근 (중복 제거) -->
        <div id="quick-menu" class="quick-menu">
            <button id="qm-menu" class="qm-btn">MENU</button>
        </div>
    </div>

    <!-- ===== Backlog Panel ===== -->
    <div id="backlog-panel" class="screen overlay hidden">

    <!-- ===== Settings Overlay ===== -->
    <div id="settings-overlay" class="screen overlay hidden">
        <div class="settings-container">
            <div class="settings-header">
                <span id="settings-title" class="settings-title">설정</span>
                <button id="settings-close" class="settings-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-row">
                    <label id="settings-bgm-label" class="settings-label" for="settings-bgm">BGM 볼륨</label>
                    <input type="range" id="settings-bgm" min="0" max="100" step="1" value="50">
                    <span id="settings-bgm-value" class="settings-value">50%</span>
                </div>
                <div class="settings-row">
                    <label id="settings-sfx-label" class="settings-label" for="settings-sfx">효과음 볼륨</label>
                    <input type="range" id="settings-sfx" min="0" max="100" step="1" value="80">
                    <span id="settings-sfx-value" class="settings-value">80%</span>
                </div>
                <div class="settings-row">
                    <label id="settings-text-speed-label" class="settings-label" for="settings-text-speed">텍스트 속도</label>
                    <input type="range" id="settings-text-speed" min="0" max="100" step="1" value="70">
                    <span id="settings-text-speed-value" class="settings-value">70%</span>
                </div>
                <div class="settings-row">
                    <span id="settings-fullscreen-label" class="settings-label">풀스크린</span>
                    <button id="settings-fullscreen-toggle" class="settings-toggle">OFF</button>
                </div>
            </div>
            <div class="settings-footer">
                <button id="settings-reset" class="menu-btn settings-reset-btn">초기화</button>
            </div>
        </div>
    </div>

    <div id="save-slot-overlay" class="screen overlay hidden">
        <div class="save-slot-container">

    <div id="sl-overlay" class="screen overlay hidden">
        <div class="sl-container">
            <div class="sl-header">
                <span id="sl-title" class="sl-title">저장</span>

            </div>

        </div>
    </div>
