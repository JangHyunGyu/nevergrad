    <!-- ===== Title Screen ===== -->
    <div id="title-screen" class="screen active">
        <a href="https://archerlab.dev" target="_blank" rel="noopener noreferrer" class="archerlab-link" aria-label="ArcherLab ホーム" title="ArcherLab">ArcherLab</a>
        <select class="lang-switcher" aria-label="言語" onchange="if(this.value)location.href=this.value">
            <option value="/">韓国語</option>
            <option value="/en/">English</option>
            <option value="/ja/">日本語</option>
            <option value="/es/">Español</option>
            <option value="/fr/">Français</option>
            <option value="/de/">Deutsch</option>
            <option value="/pt/">Português (Brasil)</option>
        </select>
        <script>
            (function(){
                var s=document.querySelector('.lang-switcher');
                if(!s)return;
                var p=location.pathname,c='/';
                ['/en/','/ja/','/es/','/fr/','/de/','/pt/'].forEach(function(x){if(p.indexOf(x)===0)c=x;});
                for(var i=0;i<s.options.length;i++)if(s.options[i].value===c){s.selectedIndex=i;break;}
            })();
        </script>
        <div class="title-bg-layer"></div>
        <div class="title-bg-vignette"></div>
        <div class="cherry-blossoms" id="cherry-blossoms"></div>
        <!-- Title background and character sprite layers. Optional assets are resolved at runtime. -->
        <div id="title-stage" class="title-stage" aria-hidden="true">
            <img id="title-stage-bg" class="title-stage-bg" alt="" data-src="../assets/images/background/cherry_blossom.webp" onerror="this.style.display='none'">
            <img id="title-char-sea" class="title-char title-char-left" alt="" data-default="../assets/images/characters/sea_normal.webp" data-ngp="../assets/images/characters/sea_stare.webp" data-src="../assets/images/characters/sea_normal.webp" onerror="this.style.display='none'">
            <img id="title-char-eunsu" class="title-char title-char-center" alt="" data-src="../assets/images/characters/eunsu_normal.webp" onerror="this.style.display='none'">
            <img id="title-char-riin" class="title-char title-char-right" alt="" data-src="../assets/images/characters/riin_smile.webp" onerror="this.style.display='none'">
        </div>
        <div class="title-content">
            <h1 class="title-text">卒業できない教室</h1>
            <div class="title-divider"></div>
            <p class="title-subtitle">5日間の記録</p>

        <div class="title-menu">

            <button id="btn-continue" class="menu-btn" disabled>つづきから</button>

        <div class="title-footer">

        </div>
    </div>

    <div id="name-screen" class="screen">

            <button id="btn-start" class="menu-btn">スタート</button>
        </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="screen">
        <!-- Background Layer -->
        <div id="bg-layer" class="bg-layer"></div>
        <div id="bg-overlay" class="bg-overlay"></div>
        <div id="media-overlay" class="scene-media-layer hidden" aria-hidden="true"></div>

        <!-- Character Layer -->
        <div id="char-layer" class="char-layer">
            <img id="char-left" class="character-sprite pos-left" src="" alt="">
            <img id="char-center" class="character-sprite pos-center" src="" alt="">
            <img id="char-right" class="character-sprite pos-right" src="" alt="">
        </div>

        <!-- Glitch Overlay (thriller) -->
        <div id="glitch-overlay" class="glitch-overlay hidden"></div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-box" role="button" tabindex="0" aria-label="台詞を進める">
            <div id="speaker-name" class="speaker-name"></div>
            <div id="dialogue-text" class="dialogue-text"></div>
            <div id="click-indicator" class="click-indicator">▼</div>
        </div>

        <!-- Choice Panel -->
        <div id="choice-panel" class="choice-panel hidden"></div>

        <!-- HUD -->
        <div id="hud" class="hud">
            <div id="day-display" class="day-display">1日目 - 朝</div>
            <div id="stat-display" class="stat-display hidden"></div>
        </div>

        <!-- Quick menu entry point. Save and load are opened through the pause menu. -->
        <div id="quick-menu" class="quick-menu">
            <button id="qm-menu" class="qm-btn">MENU</button>
        </div>
    </div>

    <div id="settings-overlay" class="screen overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">

                    <input type="range" id="settings-sfx" min="0" max="100" step="1" value="80">

                    <input type="range" id="settings-text-speed" min="0" max="100" step="1" value="70">

                <div class="settings-row">
                    <span id="settings-fullscreen-label" class="settings-label">フルスクリーン</span>

            <div class="settings-footer">
                <button id="settings-reset" class="menu-btn settings-reset-btn">リセット</button>
