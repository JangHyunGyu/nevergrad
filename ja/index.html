<body>
    <!-- ===== Title Screen ===== -->
    <div id="title-screen" class="screen active">
        <a href="https://archerlab.dev" target="_blank" rel="noopener noreferrer" class="archerlab-link" aria-label="ArcherLab ホーム" title="ArcherLab">ArcherLab</a>
        <select class="lang-switcher" aria-label="Language" onchange="if(this.value)location.href=this.value">
            <option value="/">韓国語</option>
            <option value="/en/">English</option>
            <option value="/ja/">日本語</option>
            <option value="/es/">Español</option>
            <option value="/fr/">Français</option>
            <option value="/de/">Deutsch</option>
            <option value="/pt/">Português (Brasil)</option>
        </select>
        <script>
            (function(){
                var s=document.querySelector('.lang-switcher');
                if(!s)return;
                var p=location.pathname,c='/';
                ['/en/','/ja/','/es/','/fr/','/de/','/pt/'].forEach(function(x){if(p.indexOf(x)===0)c=x;});
                for(var i=0;i<s.options.length;i++)if(s.options[i].value===c){s.selectedIndex=i;break;}
            })();
        </script>
        <div class="title-bg-layer"></div>
        <div class="title-bg-vignette"></div>
        <div class="cherry-blossoms" id="cherry-blossoms"></div>
        <!-- Title background and character sprite layers. Optional assets are resolved at runtime. -->
        <div id="title-stage" class="title-stage" aria-hidden="true">
            <img id="title-stage-bg" class="title-stage-bg" alt="" data-src="../assets/images/background/cherry_blossom.png" onerror="this.style.display='none'">
            <img id="title-char-sea" class="title-char title-char-left" alt="" data-default="../assets/images/characters/sea_normal.png" data-ngp="../assets/images/characters/sea_stare.png" data-src="../assets/images/characters/sea_normal.png" onerror="this.style.display='none'">
            <img id="title-char-eunsu" class="title-char title-char-center" alt="" data-src="../assets/images/characters/eunsu_normal.png" onerror="this.style.display='none'">
            <img id="title-char-riin" class="title-char title-char-right" alt="" data-src="../assets/images/characters/riin_smile.png" onerror="this.style.display='none'">
        </div>
        <div class="title-content">
            <h1 class="title-text">卒業できない教室</h1>
            <div class="title-divider"></div>
            <p class="title-subtitle">5日間の記録</p>
        </div>
        <div class="title-menu">
            <button id="btn-new-game" class="menu-btn">ニューゲーム</button>
            <button id="btn-continue" class="menu-btn" disabled>つづきから</button>
            <button id="btn-gallery" class="menu-btn">ギャラリー</button>
        </div>
        <div class="title-footer">
            <span class="title-copyright">NEVERGRAD</span>
        </div>
    </div>

    <!-- ===== Gallery Screen ===== -->
    <div id="gallery-screen" class="screen hidden">
        <div class="gallery-container">
            <div class="gallery-header">
                <span class="gallery-title">エンディングギャラリー</span>
                <div class="gallery-progress-area">
                    <span class="gallery-progress-label">達成率</span>
                    <span id="gallery-progress">0 / 7</span>
                </div>
            </div>
            <div id="gallery-grid"></div>
            <div class="gallery-footer">
                <button id="gallery-back" class="menu-btn">戻る</button>
            </div>
        </div>
    </div>

    <!-- ===== Name Input Screen ===== -->
    <div id="name-screen" class="screen">
        <div class="name-input-container">
            <p class="name-prompt">あなたの名前は？</p>
            <input type="text" id="player-name-input" maxlength="8" placeholder="名前を入力してください">
            <button id="btn-start" class="menu-btn">スタート</button>
        </div>
    </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="screen">
        <!-- Background Layer -->
        <div id="bg-layer" class="bg-layer"></div>
        <div id="bg-overlay" class="bg-overlay"></div>
        <div id="media-overlay" class="scene-media-layer hidden" aria-hidden="true"></div>

        <!-- Character Layer -->
        <div id="char-layer" class="char-layer">
            <img id="char-left" class="character-sprite pos-left" src="" alt="">
            <img id="char-center" class="character-sprite pos-center" src="" alt="">
            <img id="char-right" class="character-sprite pos-right" src="" alt="">
        </div>

        <!-- Glitch Overlay (thriller) -->
        <div id="glitch-overlay" class="glitch-overlay hidden"></div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-box">
            <div id="speaker-name" class="speaker-name"></div>
            <div id="dialogue-text" class="dialogue-text"></div>
            <div id="click-indicator" class="click-indicator">▼</div>
        </div>

        <!-- Choice Panel -->
        <div id="choice-panel" class="choice-panel hidden"></div>

        <!-- HUD -->
        <div id="hud" class="hud">
            <div id="day-display" class="day-display">1日目 - 朝</div>
            <div id="stat-display" class="stat-display hidden"></div>
        </div>

        <!-- Quick menu entry point. Save and load are opened through the pause menu. -->
        <div id="quick-menu" class="quick-menu">
            <button id="qm-menu" class="qm-btn">MENU</button>
        </div>
    </div>

    <!-- ===== Backlog Panel ===== -->
    <div id="backlog-panel" class="screen overlay hidden">
        <div class="backlog-container">
            <div class="backlog-header">
                <span class="backlog-title">会話ログ</span>
                <button id="backlog-close" class="backlog-close-btn">&times;</button>
            </div>
            <div id="backlog-content" class="backlog-content"></div>
        </div>
    </div>

    <!-- ===== Pause Menu ===== -->
    <div id="pause-menu" class="screen overlay hidden">
        <div class="pause-container">
            <button id="btn-save" class="menu-btn">セーブ</button>
            <button id="btn-load" class="menu-btn">ロード</button>
            <button id="btn-settings" class="menu-btn">設定</button>
            <button id="btn-title" class="menu-btn">タイトルへ</button>
            <button id="btn-resume" class="menu-btn">戻る</button>
        </div>
    </div>

    <!-- ===== Settings Overlay ===== -->
    <div id="settings-overlay" class="screen overlay hidden">
        <div class="settings-container">
            <div class="settings-header">
                <span id="settings-title" class="settings-title">設定</span>
                <button id="settings-close" class="settings-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-row">
                    <label id="settings-bgm-label" class="settings-label" for="settings-bgm">BGM 音量</label>
                    <input type="range" id="settings-bgm" min="0" max="100" step="1" value="50">
                    <span id="settings-bgm-value" class="settings-value">50%</span>
                </div>
                <div class="settings-row">
                    <label id="settings-sfx-label" class="settings-label" for="settings-sfx">効果音 音量</label>
                    <input type="range" id="settings-sfx" min="0" max="100" step="1" value="80">
                    <span id="settings-sfx-value" class="settings-value">80%</span>
                </div>
                <div class="settings-row">
                    <label id="settings-text-speed-label" class="settings-label" for="settings-text-speed">テキスト速度</label>
                    <input type="range" id="settings-text-speed" min="0" max="100" step="1" value="70">
                    <span id="settings-text-speed-value" class="settings-value">70%</span>
                </div>
                <div class="settings-row">
                    <span id="settings-fullscreen-label" class="settings-label">フルスクリーン</span>
                    <button id="settings-fullscreen-toggle" class="settings-toggle">OFF</button>
                </div>
            </div>
            <div class="settings-footer">
                <button id="settings-reset" class="menu-btn settings-reset-btn">リセット</button>
            </div>
        </div>
    </div>

    <!-- ===== Save Slot Glitch UI (Day 4 forced save-file open) ===== -->
    <div id="save-slot-overlay" class="screen overlay hidden">
        <div class="save-slot-container">
            <div class="save-slot-header">
                <span class="save-slot-title">SAVE DATA</span>
                <span class="save-slot-subtitle">— Project Nevergrad —</span>
            </div>
            <div id="save-slot-list" class="save-slot-list">
                <!-- 13 slots are generated dynamically in JS. -->
            </div>
        </div>
    </div>

    <!-- ===== Save/Load Slot Selector ===== -->
    <div id="sl-overlay" class="screen overlay hidden">
        <div class="sl-container">
            <div class="sl-header">
                <span id="sl-title" class="sl-title">セーブ</span>
                <button id="sl-close" class="sl-close-btn">&times;</button>
            </div>
            <div id="sl-slots" class="sl-slots">
                <!-- Auto slot (0) and manual slots (1-9) are generated dynamically in JS. -->
            </div>
        </div>
    </div>

    <!-- ===== Loading Screen ===== -->
    <div id="loading-screen" class="screen hidden">
        <div class="loading-container">
            <div class="loading-title">NEVERGRAD</div>
            <div class="loading-bar-outer">
                <div id="loading-bar-inner" class="loading-bar-inner"></div>
            </div>
            <div id="loading-text" class="loading-text">読み込み中...</div>
        </div>
    </div>

    <!-- ===== Rotate Prompt (mobile and tablet portrait guidance) ===== -->
    <div id="rotate-prompt" class="rotate-prompt">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">端末を横向きにしてください</div>
    </div>

    <!-- ===== Scripts ===== -->
    <!-- Language override -->
    <script>window.__NEVERGRAD_LANG__='ja';</script>

    <!-- Config & Data -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/prompts.js"></script>

    <!-- Scenario Files -->
    <script src="../assets/js/scenario/day1_1_morning.js"></script>
    <script src="../assets/js/scenario/day1_2_lunch.js"></script>
    <script src="../assets/js/scenario/day1_3_afterschool.js"></script>
    <script src="../assets/js/scenario/day1_4_night.js"></script>
    <script src="../assets/js/scenario/day2_1_morning.js"></script>
    <script src="../assets/js/scenario/day2_2_lunch.js"></script>
    <script src="../assets/js/scenario/day2_3_afterschool.js"></script>
    <script src="../assets/js/scenario/day2_4_night.js"></script>
    <script src="../assets/js/scenario/day3_1_morning.js"></script>
    <script src="../assets/js/scenario/day3_2_lunch.js"></script>
    <script src="../assets/js/scenario/day3_3_afterschool.js"></script>
    <script src="../assets/js/scenario/day3_4_night.js"></script>
    <script src="../assets/js/scenario/day4_1_morning.js"></script>
    <script src="../assets/js/scenario/day4_2_lunch.js"></script>
    <script src="../assets/js/scenario/day4_3_afterschool.js"></script>
    <script src="../assets/js/scenario/day4_4_night.js"></script>
    <script src="../assets/js/scenario/day5_1_morning.js"></script>
    <script src="../assets/js/scenario/day5_2_lunch.js"></script>
    <script src="../assets/js/scenario/day5_3_afterschool.js"></script>
    <script src="../assets/js/scenario/day5_4_night.js"></script>

    <script src="../assets/js/cage_end_pool.js"></script>

    <!-- Engine Modules -->
    <script src="../assets/js/modules/StateManager.js"></script>
    <script src="../assets/js/modules/SaveManager.js"></script>
    <script src="../assets/js/modules/I18nManager.js"></script>
    <script src="../assets/js/modules/AudioManager.js"></script>
    <script src="../assets/js/modules/BGMSynth.js"></script>
    <script src="../assets/js/modules/SceneRenderer.js"></script>
    <script src="../assets/js/modules/DialogueSystem.js"></script>
    <script src="../assets/js/modules/ChoiceSystem.js"></script>
    <script src="../assets/js/modules/GlitchSystem.js"></script>
    <script src="../assets/js/modules/GlitchSystemAdvanced.js"></script>
    <script src="../assets/js/modules/ChoiceSystemAdvanced.js"></script>
    <script src="../assets/js/modules/DeviceGimmickSystem.js"></script>
    <script src="../assets/js/modules/CrossoverSystem.js"></script>
    <script src="../assets/js/modules/MetaHorrorSystem.js"></script>
    <script src="../assets/js/modules/FaviconManager.js"></script>

    <script src="../assets/js/app.js"></script>
