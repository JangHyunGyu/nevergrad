            min-height: 100vh;

        .terminal {
            max-width: 720px;
            width: 90%;
            padding: 40px;
            border: 1px solid #1a3a1a;
            position: relative;
        }

        .terminal::before {
            content: '';

            top: 0;
            left: 0;

            background: repeating-linear-gradient(

        .divider {

            font-size: 12px;
            margin-bottom: 24px;
            opacity: 0;
            animation: typeIn 0.3s forwards;
            animation-delay: 0.8s;
        }

        .title {
            color: #33ff33;
            font-size: 16px;
            margin-bottom: 4px;
            opacity: 0;

            animation-delay: 1.2s;
        }

        .clearance {

            margin-bottom: 32px;

        }

            padding: 4px 0;
            padding-left: 16px;
            position: relative;
            opacity: 0;
        }

        .spec-list li::before {
            content: '-';
            position: absolute;
            left: 0;
        }

        .spec-list li:nth-child(1) { animation: typeIn 0.4s forwards; animation-delay: 2.6s; }
        .spec-list li:nth-child(2) { animation: typeIn 0.4s forwards; animation-delay: 2.9s; }
        .spec-list li:nth-child(3) { animation: typeIn 0.4s forwards; animation-delay: 3.2s; }

            cursor: pointer;
            text-decoration: none;

            transition: background 0.2s, color 0.2s;
        }

        .preview-btn:hover {
            background: #33ff33;
            color: #0a0a0a;
        }

        @keyframes typeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink-border {
            0%, 100% { border-color: #33ff33; }
            50% { border-color: #0a3a0a; }
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: #33ff33;
            animation: cursor 1s step-end infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* CRT flicker effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            animation: flicker 0.15s infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            50% { opacity: 0; }
            100% { opacity: 0.02; }
